[package]
name = "clean-you"
version = "0.1.0"
edition = "2021"
description = "A fast, native macOS cleaner: junk, dev caches, AI models, duplicates, uninstaller, disk map, privacy, startup items and battery care."
license = "MIT"
repository = "https://github.com/luckyklyist/cleanupmacbro"
readme = "README.md"
keywords = ["macos", "cleaner", "disk-space", "battery", "egui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
walkdir = "2"
trash = "5"
plist = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
egui-phosphor = "0.7"
tray-icon = { version = "0.19", default-features = false }
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
